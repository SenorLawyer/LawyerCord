packages:
    - packages/*
overrides:
    glob@>=9.0.0 <14.0.2: 14.0.2
    minimatch@<11.0.1: 11.0.1
    brace-expansion@<1.1.21: 1.1.21
    brace-expansion@>=2.0.0 <2.1.7: 2.1.7
    brace-expansion@>=4.0.0 <5.0.12: 5.0.12
    dompurify: 3.4.17
    fast-uri: 3.1.9
    source-map-js: 1.2.2
    postcss-selector-parser@>=7.0.0 <7.1.6: 7.1.7
    zod@<4.6.6: 4.6.7
peerDependencyRules:
    ignoreMissing:
        - eslint-plugin-import
        - eslint
allowedDeprecatedVersions:
    source-map-resolve: "*"
    resolve-url: "*"
    source-map-url: "*"
    urix: "*"
    q: "*"
strictPeerDependencies: false
allowBuilds:
    esbuild: true
pmOnFail: warn
verifyDepsBeforeRun: prompt
minimumReleaseAgeExclude:
    # Notes added 2026-10-27 from git history. Revisit each entry once its version is older than minimumReleaseAge, then drop it.
    # Added 2026-07-09 (8e9d78c3a) with SongSpotlight, which needs this exact release. Revisit when SongSpotlight bumps the package.
    - "@song-spotlight/api@2.2.0"
    # Added 2026-07-28 (13a7d4688, Harden build dependencies) to pull in security fixes before the age window passed. Revisit by 2026-11-28.
    - minimatch@3.1.3 || 3.1.4 || 9.0.6 || 9.0.7
    # Added 2026-07-28 (13a7d4688), same hardening pass. Revisit by 2026-11-28.
    - flatted@3.4.0 || 3.4.2
    # Pins follow the brace-expansion overrides above. Added 2026-07-28, last bumped 2026-10-02 (f4b27c59d). Revisit when the overrides move.
    - brace-expansion@1.1.21 || 2.1.7 || 5.0.12
    # Added 2026-07-28 (13a7d4688), same hardening pass. Revisit by 2026-11-28.
    - picomatch@2.3.2 || 4.0.4
    # Pins follow the fast-uri override above. Last bumped 2026-10-02 (f4b27c59d). Revisit when the override moves.
    - fast-uri@3.1.9
    # Added 2026-07-28 (13a7d4688), same hardening pass. Revisit by 2026-11-28.
    - postcss@8.5.18
    # Added 2026-08-29 (704059252, Lawyers Fake Nitro) for a security fix. Revisit by 2026-11-29.
    - js-yaml@4.3.1
    # Pins follow the dompurify override above. Added 2026-08-29, last bumped 2026-10-02 (f4b27c59d). Revisit when the override moves.
    - dompurify@3.4.17
    # Added 2026-08-29 (704059252, Lawyers Fake Nitro). Revisit by 2026-11-29.
    - nanoid@3.3.18
    # Added 2026-10-02 (f4b27c59d, Stable 3.0.1.0 audit). Revisit by 2026-11-02.
    - moment@2.31.0
patchedDependencies:
    braces@3.0.3: patches/braces@3.0.3.patch
    minimatch@11.0.1: patches/minimatch@11.0.1.patch
