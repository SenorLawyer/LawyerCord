packages:
    - packages/*
overrides:
    brace-expansion@<1.1.21: 1.1.21
    brace-expansion@>=2.0.0 <2.1.7: 2.1.7
    brace-expansion@>=4.0.0 <5.0.12: 5.0.12
    dompurify: 3.4.16
    fast-uri: 3.1.8
peerDependencyRules:
    ignoreMissing:
        - eslint-plugin-import
        - eslint
allowedDeprecatedVersions:
    source-map-resolve: "*"
    resolve-url: "*"
    source-map-url: "*"
    urix: "*"
    q: "*"
strictPeerDependencies: false
allowBuilds:
    esbuild: true
pmOnFail: warn
verifyDepsBeforeRun: prompt
minimumReleaseAgeExclude:
    - "@song-spotlight/api@2.2.0"
    - minimatch@3.1.3 || 3.1.4 || 9.0.6 || 9.0.7
    - flatted@3.4.0 || 3.4.2
    - brace-expansion@1.1.21 || 2.1.7 || 5.0.12
    - picomatch@2.3.2 || 4.0.4
    - fast-uri@3.1.8
    - postcss@8.5.18
    - js-yaml@4.3.1
    - dompurify@3.4.16
    - nanoid@3.3.18
    - moment@2.31.0
patchedDependencies:
    braces@3.0.3: patches/braces@3.0.3.patch
