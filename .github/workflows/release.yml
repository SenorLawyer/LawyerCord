name: Release channels
run-name: "Release ${{ github.event_name == 'workflow_dispatch' && inputs.channel || format('PR {0}', github.event.pull_request.number) }}"

on:
    pull_request:
        branches: [main]
        types: [closed]
    workflow_dispatch:
        inputs:
            channel:
                description: Release channel for the current main commit
                required: true
                default: nightly
                type: choice
                options:
                    - nightly
                    - beta
                    - stable

permissions:
    contents: read

concurrency:
    group: release-${{ github.event.pull_request.merge_commit_sha || github.sha }}
    cancel-in-progress: false

jobs:
    classify:
        name: Select release channel
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            channel: ${{ steps.release.outputs.channel }}
            ref: ${{ steps.release.outputs.ref }}

        steps:
            - name: Resolve merged-PR release label
              id: release
              shell: pwsh
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  INPUT_CHANNEL: ${{ inputs.channel }}
                  LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
                  MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
              run: |
                  if ($env:EVENT_NAME -eq "workflow_dispatch") {
                      $channel = $env:INPUT_CHANNEL
                      $ref = "main"
                  } else {
                      $labels = if ([string]::IsNullOrWhiteSpace($env:LABELS_JSON)) {
                          @()
                      } else {
                          @(ConvertFrom-Json $env:LABELS_JSON)
                      }
                      if ($labels -contains "release:skip") {
                          $channel = "skip"
                      } else {
                          $selected = @(
                              $labels |
                                  Where-Object { $_ -in @("release:nightly", "release:beta", "release:stable") } |
                                  ForEach-Object { $_.Substring("release:".Length) }
                          )
                          if ($selected.Count -gt 1) {
                              throw "A pull request may select only one release channel"
                          }
                          $channel = if ($selected.Count -eq 1) { $selected[0] } else { "skip" }
                      }
                      $ref = $env:MERGE_SHA
                  }

                  "channel=$channel" >> $env:GITHUB_OUTPUT
                  "ref=$ref" >> $env:GITHUB_OUTPUT
                  Write-Output "Selected release channel: $channel"

    release:
        name: Build ${{ needs.classify.outputs.channel }} release
        needs: classify
        if: needs.classify.outputs.channel != 'skip'
        runs-on: windows-latest
        timeout-minutes: 50
        permissions:
            contents: write
        env:
            RELEASE_CHANNEL: ${{ needs.classify.outputs.channel }}
            RELEASE_REF: ${{ needs.classify.outputs.ref }}

        steps:
            - name: Check out merged source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  ref: ${{ env.RELEASE_REF }}

            - name: Check out audited installer source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  repository: Equicord/Equilotl
                  ref: c6bfed9c941883fb0aa48cc1ab6031ed69334c2a
                  path: installer-source
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: 1.26.5
                  cache-dependency-path: installer-source/go.sum

            - name: Set up MSYS2
              uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
              with:
                  path-type: inherit

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit and test release source
              run: |
                  pnpm audit --audit-level moderate
                  pnpm testTsc
                  pnpm testPerformance
                  pnpm testStartupFlags
                  pnpm testAutomations
                  pnpm testDiscordMcp
                  pnpm testReleaseArtifactAudit
                  pnpm testSecureMessaging
                  pnpm testSecureMessagingNative
                  pnpm testUpdateChannelSelection
                  pnpm testInstallerStaleMarkerRepair

            - name: Build desktop and browser targets
              run: |
                  pnpm buildStandalone
                  pnpm buildWebStandalone

            - name: Reject packaged credentials and private runtime data
              run: pnpm auditReleaseArtifacts dist

            - name: Resolve release identity
              id: release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $version = (Get-Content -LiteralPath package.json | ConvertFrom-Json).version
                  $shortSha = (git rev-parse --short=8 HEAD).Trim()
                  $timestamp = (Get-Date).ToUniversalTime().ToString("yyyyMMdd-HHmm")

                  $tag = switch ($env:RELEASE_CHANNEL) {
                      "nightly" { "nightly-$timestamp-$shortSha" }
                      "beta" { "v$version-beta.$env:GITHUB_RUN_NUMBER" }
                      "stable" { "v$version" }
                      default { throw "Unsupported release channel: $env:RELEASE_CHANNEL" }
                  }

                  $matchingTags = @(
                      gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" |
                          ConvertFrom-Json
                  )
                  if ($matchingTags.Count -ne 0) {
                      throw "Release tag $tag already exists; version tags are immutable"
                  }

                  "tag=$tag" >> $env:GITHUB_OUTPUT
                  "title=LawyerCord $tag" >> $env:GITHUB_OUTPUT

            - name: Prepare offline LawyerCord installer source
              run: node scripts/prepareInstallerSource.mjs installer-source "${{ steps.release.outputs.tag }}" "$(git rev-parse HEAD)" dist/desktop.asar

            - name: Install Windows installer build dependencies
              shell: msys2 {0}
              run: pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2

            - name: Build Windows installers
              shell: msys2 {0}
              working-directory: installer-source
              env:
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  go mod download
                  version=$(node -p "require('../package.json').version")
                  go run github.com/tc-hib/go-winres@v0.3.3 make --product-version "$version"
                  installer_hash=$(git rev-parse --short=12 HEAD)
                  client_hash=$(git -C .. rev-parse HEAD)
                  ldflags="-s -w -X equilotl/buildinfo.InstallerGitHash=$installer_hash -X equilotl/buildinfo.InstallerTag=$RELEASE_TAG -X equilotl/buildinfo.ClientGitHash=$client_hash"
                  CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -tags "static gui" -ldflags "$ldflags -H=windowsgui -extldflags=-static" -o ../LawyerCordInstaller.exe
                  CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -tags cli -ldflags "$ldflags" -o ../LawyerCordInstallerCli.exe

            - name: Validate Windows installer executables
              shell: pwsh
              run: |
                  $versionOutput = & .\LawyerCordInstallerCli.exe --version
                  if ($LASTEXITCODE -ne 0) {
                      throw "LawyerCordInstallerCli.exe --version failed"
                  }
                  $versionText = $versionOutput -join "`n"
                  if ($versionText -notmatch [regex]::Escape("${{ steps.release.outputs.tag }}")) {
                      throw "Installer CLI does not identify the selected release"
                  }
                  foreach ($installer in @("LawyerCordInstaller.exe", "LawyerCordInstallerCli.exe")) {
                      $header = Get-Content -LiteralPath $installer -AsByteStream -TotalCount 2
                      if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
                          throw "$installer is not a Windows PE executable"
                      }
                  }

            - name: Prepare release assets
              id: assets
              shell: pwsh
              env:
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  $bundle = "LawyerCord-$env:RELEASE_TAG-windows.zip"
                  $source = "LawyerCordInstaller-source-$env:RELEASE_TAG.zip"
                  Compress-Archive -Path dist\* -DestinationPath $bundle
                  Compress-Archive -Path installer-source\* -DestinationPath $source
                  Copy-Item -LiteralPath dist\desktop.asar -Destination desktop.asar
                  Copy-Item -LiteralPath dist\desktop.asar -Destination LawyerCord.asar

                  $assets = @(
                      $bundle,
                      "LawyerCordInstaller.exe",
                      "LawyerCordInstallerCli.exe",
                      "desktop.asar",
                      "LawyerCord.asar",
                      $source
                  )
                  pnpm auditReleaseArtifacts @assets
                  $checksums = foreach ($asset in $assets) {
                      $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
                      "$hash  $asset"
                  }
                  $checksums | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8NoBOM

                  "bundle=$bundle" >> $env:GITHUB_OUTPUT
                  "source=$source" >> $env:GITHUB_OUTPUT

            - name: Preserve release assets
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: LawyerCord-${{ steps.release.outputs.tag }}
                  path: |
                      ${{ steps.assets.outputs.bundle }}
                      LawyerCordInstaller.exe
                      LawyerCordInstallerCli.exe
                      desktop.asar
                      LawyerCord.asar
                      ${{ steps.assets.outputs.source }}
                      SHA256SUMS.txt
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish GitHub release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_BUNDLE: ${{ steps.assets.outputs.bundle }}
                  RELEASE_SOURCE: ${{ steps.assets.outputs.source }}
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
                  RELEASE_TITLE: ${{ steps.release.outputs.title }}
              run: |
                  $releaseArguments = @(
                      $env:RELEASE_TAG,
                      $env:RELEASE_BUNDLE,
                      "LawyerCordInstaller.exe",
                      "LawyerCordInstallerCli.exe",
                      "desktop.asar",
                      "LawyerCord.asar",
                      $env:RELEASE_SOURCE,
                      "SHA256SUMS.txt",
                      "--target",
                      $env:RELEASE_REF,
                      "--generate-notes",
                      "--title",
                      $env:RELEASE_TITLE
                  )
                  if ($env:RELEASE_CHANNEL -eq "stable") {
                      gh release create @releaseArguments --latest
                  } else {
                      gh release create @releaseArguments --prerelease --latest=false
                  }

            - name: Advance source update channels
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $branches = switch ($env:RELEASE_CHANNEL) {
                      "stable" { @("beta", "nightly") }
                      "beta" { @("beta", "nightly") }
                      "nightly" { @("nightly") }
                      default { throw "Unsupported release channel: $env:RELEASE_CHANNEL" }
                  }
                  $sha = git rev-parse $env:RELEASE_REF
                  foreach ($branch in $branches) {
                      gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>$null
                      if ($LASTEXITCODE -eq 0) {
                          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branch" -f sha=$sha -F force=false --silent
                      } else {
                          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha=$sha --silent
                      }
                  }
