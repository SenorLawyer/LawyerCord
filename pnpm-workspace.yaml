packages:
    - packages/*
overrides:
    brace-expansion@<1.1.16: ^1.1.16
    brace-expansion@<=5.0.7: ^5.0.8
    dompurify: 3.4.12
peerDependencyRules:
    ignoreMissing:
        - eslint-plugin-import
        - eslint
allowedDeprecatedVersions:
    source-map-resolve: "*"
    resolve-url: "*"
    source-map-url: "*"
    urix: "*"
    q: "*"
strictPeerDependencies: false
allowBuilds:
    esbuild: true
pmOnFail: warn
verifyDepsBeforeRun: prompt
minimumReleaseAgeExclude:
    - "@song-spotlight/api@2.2.0"
    - minimatch@3.1.3 || 3.1.4 || 9.0.6 || 9.0.7
    - flatted@3.4.0 || 3.4.2
    - brace-expansion@1.1.13 || 1.1.16 || 2.1.2 || 5.0.8
    - picomatch@2.3.2 || 4.0.4
    - svgo@4.0.2
    - fast-uri@3.1.4
    - postcss@8.5.18
