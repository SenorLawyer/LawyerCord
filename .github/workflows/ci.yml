name: Build and test

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit dependency graph
              run: pnpm audit --audit-level moderate

            - name: Type-check
              run: pnpm testTsc

            - name: Run focused tests
              run: |
                  pnpm testMessageEventsPriority
                  pnpm testDiscordMcp
                  pnpm testControlPanel
                  pnpm testReleaseArtifactAudit
                  pnpm testSecureMessaging
                  pnpm testSecureMessagingNative
                  pnpm testUpdateChannelSelection

            - name: Lint
              run: |
                  pnpm lint
                  pnpm lint-styles
                  pnpm lint:intl
                  pnpm lint:patches

            - name: Verify generated privacy inventory
              run: |
                  pnpm generatePrivacyInventory
                  git diff --exit-code -- src/equicordplugins/controlPanel.desktop/privacyInventory.ts

            - name: Build desktop and browser targets
              run: |
                  pnpm buildStandalone
                  pnpm buildWebStandalone

            - name: Reject packaged credentials and private runtime data
              run: pnpm auditReleaseArtifacts dist

            - name: Upload build output
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: lawyercord-build-${{ github.sha }}
                  path: dist/
                  if-no-files-found: error
                  retention-days: 7

    windows-smoke:
        name: Windows smoke
        runs-on: windows-latest
        timeout-minutes: 45

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Check out audited installer source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  repository: Equicord/Equilotl
                  ref: c6bfed9c941883fb0aa48cc1ab6031ed69334c2a
                  path: installer-source
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: 1.26.5
                  cache-dependency-path: installer-source/go.sum

            - name: Set up MSYS2
              uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
              with:
                  path-type: inherit

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate Windows build
              run: |
                  pnpm buildStandalone
                  pnpm auditReleaseArtifacts dist

            - name: Prepare offline LawyerCord installer source
              run: node scripts/prepareInstallerSource.mjs installer-source "ci-${{ github.sha }}" "${{ github.sha }}" dist/desktop.asar

            - name: Install Windows installer build dependencies
              shell: msys2 {0}
              run: pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2

            - name: Build Windows installers
              shell: msys2 {0}
              working-directory: installer-source
              run: |
                  go mod download
                  version=$(node -p "require('../package.json').version")
                  go run github.com/tc-hib/go-winres@v0.3.3 make --product-version "$version"
                  installer_hash=$(git rev-parse --short=12 HEAD)
                  client_hash=$(git -C .. rev-parse HEAD)
                  ldflags="-s -w -X equilotl/buildinfo.InstallerGitHash=$installer_hash -X equilotl/buildinfo.InstallerTag=ci-$client_hash -X equilotl/buildinfo.ClientGitHash=$client_hash"
                  CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -tags "static gui" -ldflags "$ldflags -H=windowsgui -extldflags=-static" -o ../LawyerCordInstaller.exe
                  CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -tags cli -ldflags "$ldflags" -o ../LawyerCordInstallerCli.exe

            - name: Validate Windows installer executables
              shell: pwsh
              run: |
                  $versionOutput = & .\LawyerCordInstallerCli.exe --version
                  if ($LASTEXITCODE -ne 0) {
                      throw "LawyerCordInstallerCli.exe --version failed"
                  }
                  $versionText = $versionOutput -join "`n"
                  if ($versionText -notmatch "LawyerCord Installer Cli") {
                      throw "Installer CLI is not LawyerCord branded"
                  }
                  foreach ($installer in @("LawyerCordInstaller.exe", "LawyerCordInstallerCli.exe")) {
                      $header = Get-Content -LiteralPath $installer -AsByteStream -TotalCount 2
                      if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
                          throw "$installer is not a Windows PE executable"
                      }
                  }
                  pnpm auditReleaseArtifacts LawyerCordInstaller.exe LawyerCordInstallerCli.exe
