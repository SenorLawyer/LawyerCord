name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: Existing version tag to release
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        name: Build release
        runs-on: windows-latest
        timeout-minutes: 30
        env:
            RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  ref: ${{ env.RELEASE_TAG }}

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate tag version
              shell: pwsh
              run: |
                  $packageVersion = (Get-Content -LiteralPath package.json | ConvertFrom-Json).version
                  if ($env:RELEASE_TAG -ne "v$packageVersion") {
                      throw "Tag $env:RELEASE_TAG does not match package version v$packageVersion"
                  }

            - name: Build and test
              run: |
                  pnpm testTsc
                  pnpm testDiscordMcp
                  pnpm testControlPanel
                  pnpm buildStandalone
                  pnpm buildWebStandalone

            - name: Package build output
              shell: pwsh
              run: Compress-Archive -Path dist\* -DestinationPath "LawyerCord-$env:RELEASE_TAG.zip"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: pwsh
              run: gh release create "$env:RELEASE_TAG" "LawyerCord-$env:RELEASE_TAG.zip" --verify-tag --generate-notes --title "LawyerCord $env:RELEASE_TAG"
