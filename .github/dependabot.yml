version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "04:00"
          timezone: Europe/Amsterdam
      open-pull-requests-limit: 5
      labels:
          - dependencies
      groups:
          production:
              dependency-type: production
          development:
              dependency-type: development

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "04:30"
          timezone: Europe/Amsterdam
      open-pull-requests-limit: 5
      labels:
          - dependencies
