name: Feature Request
description: Propose a focused feature or improvement for LawyerCord.
labels: [enhancement]
title: "[Feature] <title>"

body:
    - type: markdown
      attributes:
          value: |
              - Keep requests scoped to LawyerCord.
              - Explain any new network access, stored data, or Discord write capability.

    - type: textarea
      id: feature-description
      attributes:
          label: A clear and concise description of the feature you'd like to see
      validations:
          required: true

    - type: textarea
      id: implementation-notes
      attributes:
          label: Implementation Notes
          description: If you have ideas about how this could be implemented technically, share them here
      validations:
          required: false

    - type: textarea
      id: additional-context
      attributes:
          label: Additional context
          description: Screenshots, mockups, examples from other apps, etc.
      validations:
          required: false

    - type: checkboxes
      id: agreement-check
      attributes:
          label: Request Agreement
          options:
              - label: I've searched existing issues and this hasn't been suggested before
              - label: I have described the feature's privacy and security impact
